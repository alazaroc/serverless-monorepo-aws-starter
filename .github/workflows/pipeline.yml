name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: {{AWS_REGION}}
  CI: true

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # CI · Stage 1: Static analysis
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run quality:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Run backend tests
        run: npm run test -w backend
      - name: Run frontend tests
        run: npm run test -w frontend

  # ─────────────────────────────────────────────────────────────
  # CI · Stage 2: Build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend (stub .env for build validation)
        run: |
          cat > frontend/.env <<EOF
          VITE_API_URL=https://stub.example.com
          VITE_USER_POOL_ID=stub
          VITE_USER_POOL_CLIENT_ID=stub
          EOF
          npm run build:frontend
      - name: CDK synth (validate infrastructure)
        run: |
          cd infra/cdk
          npx cdk synth --context env=test --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ─────────────────────────────────────────────────────────────
  # CD · Deploy to TEST (non-main branches, push only)
  # ─────────────────────────────────────────────────────────────
  deploy-test:
    name: Deploy (test)
    runs-on: ubuntu-latest
    needs: [build]
    # Skipped (not failed) until AWS_ROLE_FOR_GITHUB_DEPLOYMENTS is configured, so the
    # untouched template repo stays green. Set the variable to enable deploys.
    if: github.ref != 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS != ''
    environment:
      name: test
    env:
      AWS_ROLE: ${{ vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required variables
        run: |
          set -e
          if [[ -z "${AWS_ROLE}" ]]; then
            echo "Missing required variable: AWS_ROLE (vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS)"
            exit 1
          fi
          echo "Environment OK."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Cache deployment hashes
        uses: actions/cache@v4
        with:
          path: .deploy-hashes/
          key: deploy-test-${{ github.sha }}
          restore-keys: |
            deploy-test-
      - name: Deploy to TEST environment
        run: ENV=test bash scripts/deploy.sh all

  # ─────────────────────────────────────────────────────────────
  # CD · Deploy to PROD (main only)
  # ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: [build]
    # Skipped (not failed) until AWS_ROLE_FOR_GITHUB_DEPLOYMENTS is configured.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS != ''
    environment:
      name: prod
    env:
      AWS_ROLE: ${{ vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required variables
        run: |
          set -e
          if [[ -z "${AWS_ROLE}" ]]; then
            echo "Missing required variable: AWS_ROLE (vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS)"
            exit 1
          fi
          echo "Environment OK."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Cache deployment hashes
        uses: actions/cache@v4
        with:
          path: .deploy-hashes/
          key: deploy-prod-${{ github.sha }}
          restore-keys: |
            deploy-prod-
      - name: Deploy to PROD environment
        run: ENV=prod bash scripts/deploy.sh all
